name: Build & Release

# A tag v1.2.3 builds the Windows installer and publishes it as a GitHub Release. The portal's Settings →
# Warehouse app links to .../releases/latest/download/reitrn-warehouse-setup.exe (fuilfl: fuilfl-warehouse-setup.exe —
# the matrix builds both from one tag), so a new tag is a new
# download with nothing else to touch. Run by hand (workflow_dispatch) to test a build without releasing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        brand: [reitrn, fuilfl]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Select brand
        run: node brand.mjs ${{ matrix.brand }}
      - name: Build installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-warehouse-win
          path: dist/*.exe
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
